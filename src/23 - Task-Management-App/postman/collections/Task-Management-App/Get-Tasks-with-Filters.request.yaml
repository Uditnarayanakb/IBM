$kind: http-request
name: Get Tasks with Filters
method: GET
url: '{{baseUrl}}/tasks'
order: 5000
queryParams:
  - key: priority
    value: high
  - key: completed
    value: 'false'
  - key: sortBy
    value: 'createdAt:desc'
  - key: page
    value: '1'
  - key: limit
    value: '5'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Filtered tasks returned", function () {
        pm.expect(pm.response.json()).to.be.an("object");
      });
